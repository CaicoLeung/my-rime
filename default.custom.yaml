# default.custom.yaml
# 让 Caps Lock 切换中英，禁用 Shift 切换中英。
# 配合 macOS：系统设置 → 键盘 → 输入法 → 编辑…
#   → 关闭「使用大写锁定键在 ABC 之间切换」(去掉勾选)，
#   否则系统会先拦截 Caps Lock，Rime 收不到事件。

patch:
  ascii_composer/good_old_caps_lock: false      # false=中英切换, true=传统大写
  ascii_composer/switch_key/Caps_Lock: commit_code   # 上屏原始编码后切英文
  ascii_composer/switch_key/Shift_L: noop      # 禁用左 Shift 切换
  ascii_composer/switch_key/Shift_R: noop      # 禁用右 Shift 切换
  ascii_composer/switch_key/Control_L: noop
  ascii_composer/switch_key/Control_R: noop
